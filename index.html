<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Budget</title><link rel="icon" href="icons/favicon-32.png"><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#0f5c63;color:#fff;min-height:100vh;margin:0;display:grid;place-items:center;padding:16px;text-align:center;line-height:1.5}</style></head>
<body><main><h1>Mon Budget</h1><p>Ouvrez le lien personnel qui vous a été envoyé.</p></main>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { const p = new URL(r.scope).pathname; if (!/\/(v2|v3|budget-\d+)\/$/.test(p)) r.unregister(); })).catch(() => {});</script>
</body></html>
