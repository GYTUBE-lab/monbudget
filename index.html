<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Budget</title><meta http-equiv="refresh" content="0; url=./v2/"><link rel="icon" href="icons/favicon-32.png">
<style>body{font-family:system-ui,sans-serif;background:#0f5c63;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:16px}a{color:#fff;font-weight:700}</style></head>
<body><p>Mon Budget a déménagé.<br><a href="./v2/">Ouvrir Mon Budget</a></p>
<script>
// L'ancienne version (v1) est retirée : on nettoie son fonctionnement hors connexion puis on ouvre la v2.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (!new URL(r.scope).pathname.endsWith('/v2/')) r.unregister(); })).catch(() => {});
location.replace('./v2/' + location.search + location.hash);
</script></body></html>
